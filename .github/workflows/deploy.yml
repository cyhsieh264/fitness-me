# Build and deploy.
#
# Third-party actions are pinned to commit SHA (not tag). Tags are mutable —
# a maintainer (or attacker who took over the maintainer's account) can move
# the tag to a malicious commit at any time. Pinning to SHA means we run
# exactly the audited code we pinned, even if the upstream repo is later
# compromised. To upgrade an action: bump the SHA and update the trailing
# comment with the new version. Verify the SHA on GitHub before pinning.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default to read-only; jobs override for the narrow scope they actually need.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fitness-me

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # required to push the image to ghcr.io
    outputs:
      image_lower: ${{ steps.lower.outputs.image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      # GHCR rejects upper-case image paths.
      - id: lower
        run: echo "image=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.lower.outputs.image }}:latest
            ${{ steps.lower.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      # Sync docker-compose.yml + Caddyfile to the VM. .env is written
      # separately in the next step so the secret values transit only via
      # the SSH session (and stay masked in workflow logs).
      - uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634  # v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: "~/fitness-me/"
          strip_components: 1

      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          ADMIN_LINE_USER_ID: ${{ secrets.ADMIN_LINE_USER_ID }}
          BASE_URL: ${{ secrets.BASE_URL }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          DOMAIN: ${{ secrets.DOMAIN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: LINE_CHANNEL_SECRET,LINE_CHANNEL_ACCESS_TOKEN,LLM_PROVIDER,LLM_API_KEY,LLM_MODEL,DATABASE_URL,STORAGE_PROVIDER,SUPABASE_URL,SUPABASE_SERVICE_KEY,SUPABASE_BUCKET,ALLOWED_USER_IDS,ADMIN_API_KEY,ADMIN_LINE_USER_ID,BASE_URL,TIMEZONE,DOMAIN
          script: |
            set -e
            cd ~/fitness-me

            umask 077
            cat > .env <<EOF
            LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET}
            LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN}
            LLM_PROVIDER=${LLM_PROVIDER}
            LLM_API_KEY=${LLM_API_KEY}
            LLM_MODEL=${LLM_MODEL}
            DATABASE_URL=${DATABASE_URL}
            STORAGE_PROVIDER=${STORAGE_PROVIDER}
            SUPABASE_URL=${SUPABASE_URL}
            SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
            SUPABASE_BUCKET=${SUPABASE_BUCKET}
            ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
            ADMIN_API_KEY=${ADMIN_API_KEY}
            ADMIN_LINE_USER_ID=${ADMIN_LINE_USER_ID}
            BASE_URL=${BASE_URL}
            TIMEZONE=${TIMEZONE}
            DOMAIN=${DOMAIN}
            EOF

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
