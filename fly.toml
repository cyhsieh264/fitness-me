# Fly.io deployment config. Run `fly launch --no-deploy` once to set the app
# name, then `fly deploy`. Secrets (LINE_*, LLM_API_KEY, DATABASE_URL,
# SUPABASE_*, ALLOWED_USER_IDS, ADMIN_TOKEN, BASE_URL) are set via
# `fly secrets set KEY=value`.

app = "fitness-me"
primary_region = "nrt"

[build]

[env]
  PORT = "8000"
  STORAGE_PROVIDER = "supabase"
  TIMEZONE = "Asia/Taipei"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# To run with STORAGE_PROVIDER=local instead of Supabase, attach a volume
# and uncomment the mount:
#
# [[mounts]]
#   source = "fitness_data"
#   destination = "/app/data"
