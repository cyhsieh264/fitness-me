# Production stack on the GCP e2-micro VM.
# - app: FastAPI server, image built by the GitHub Actions deploy workflow
# - caddy: HTTPS termination, Let's Encrypt cert via HTTP-01 challenge
#
# This file is scp'd to ~/fitness-me/docker-compose.yml during deploy.
# The .env file in the same directory is generated by the deploy workflow
# from GitHub repo secrets.

services:
  app:
    image: ghcr.io/cyhsieh264/fitness-me:latest
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    networks:
      - web
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
